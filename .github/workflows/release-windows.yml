name: release-windows
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q app
          python -m pytest -q
      - name: Verify Windows hardware dependencies
        working-directory: backend
        run: |
          pip install -r requirements-hardware.txt
          python -c "import J2534; print('J2534 import OK')"
          python -c "import can, cantools; print('python-can/cantools import OK')"
      - name: Copy frontend into backend static
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/app/static | Out-Null
          Copy-Item frontend/dist/* backend/app/static -Recurse -Force
      - name: Assemble vehicle-test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SherloCAN-v0.2.1-vehicle-test | Out-Null
          Copy-Item backend,scripts,docs,vehicle_profiles,sample_data dist/SherloCAN-v0.2.1-vehicle-test -Recurse
          Copy-Item README.md dist/SherloCAN-v0.2.1-vehicle-test/
          Compress-Archive dist/SherloCAN-v0.2.1-vehicle-test dist/SherloCAN-v0.2.1-vehicle-test-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SherloCAN-v0.2.1-vehicle-test-windows
          path: dist/SherloCAN-v0.2.1-vehicle-test-windows.zip
